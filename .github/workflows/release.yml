# Builds Slopinator for macOS, Windows, and Linux and publishes all
# three to the GitHub Releases tab. PyInstaller can't cross-compile —
# master-bin has to be frozen natively on each OS — so this runs as a
# matrix across GitHub's own macos/windows/ubuntu runners rather than
# building everything from one machine. See docs/context.md's "App size"
# section for what master-bin actually is and why it exists.
#
# Triggered by pushing a version tag matching package.json's "version"
# (e.g. version "0.1.0" -> `git tag v0.1.0 && git push origin v0.1.0`),
# or manually via the Actions tab (workflow_dispatch).
#
# macOS build is ad-hoc signed (scripts/afterSign.js) — satisfies
# Gatekeeper on the machine that built it, not a machine it's copied to,
# since there's no Apple Developer ID certificate configured (see
# docs/todos.md). Windows and Linux builds are unsigned; Windows users
# will see a SmartScreen warning on first run.
#
# Publishes as a draft (build.publish.releaseType in package.json) —
# never goes live on its own. The release-notes job fills the draft's
# title/body from docs/changelog.md's [Unreleased] section (everything
# since the last tag) once all three platform builds finish uploading;
# review/trim/publish it by hand from the GitHub Releases tab.
#
# electron-builder names its GitHub release v<package.json's "version">
# (vPrefixedTagName, on by default) — NOT whatever git tag actually
# triggered this workflow. Push a tag matching package.json's version
# (bump one to match the other first) to avoid confusion, but
# release-notes below re-derives the real tag from package.json itself
# regardless, so it finds the right release even if they diverge — this
# bit the very first release (v0.1 pushed, package.json said 0.1.0,
# electron-builder published as v0.1.0, and gh release edit "v0.1"
# failed with "release not found").
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Node dependencies
        run: npm ci

      - name: Create Python venv and install build dependencies
        shell: bash
        run: |
          python -m venv .venv
          if [ -f .venv/Scripts/python.exe ]; then
            .venv/Scripts/python.exe -m pip install --quiet -r requirements.txt
          else
            .venv/bin/python3 -m pip install --quiet -r requirements.txt
          fi

      - name: Build and publish
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-notes:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine the release tag electron-builder actually used
        id: tag
        run: |
          version=$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Extract changelog's section for this version
        # Not [Unreleased] — once a release is actually cut (see
        # docs/context.md's "Versioning" gotcha), [Unreleased] is the
        # *empty* placeholder for the *next* release, and the just-shipped
        # content lives under its own "## [x.y.z]" heading instead. This
        # bit v0.2.0's first publish: the notes came out as three empty
        # headers because this step still grabbed [Unreleased].
        run: |
          version="${{ steps.tag.outputs.version }}"
          awk -v ver="$version" '
            $0 ~ ("^## \\[" ver "\\]") {flag=1; next}
            /^## \[/ {flag=0}
            flag
          ' docs/changelog.md > release-notes.md

      - name: Set release title and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ steps.tag.outputs.tag }}" \
            --title "Slopinator ${{ steps.tag.outputs.tag }}" \
            --notes-file release-notes.md \
            --draft \
            --repo "${{ github.repository }}"
